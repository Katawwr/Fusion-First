# Publish fusion-safety to PyPI when a version tag is pushed (git tag v0.1.2 && git push origin v0.1.2).
# Trusted Publishing: PyPI trusts this workflow's short-lived GitHub identity, so no API token exists anywhere.
# One-time setup on PyPI (project fusion-safety > Publishing): owner Katawwr, repository Fusion-First,
# workflow release.yml, environment pypi. See docs/RELEASE.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FUSION_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag names the package version
        run: python scripts/release_tag_check.py "$GITHUB_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app (the wheel bundles it)
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import fusion_first; print(fusion_first.__version__)"
          /tmp/smoke/bin/fusion guard-bench
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fusion-safety/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
