# Fail the build when an agent's system prompt is unsafe.
# Copy to .github/workflows/agent-safety.yml
name: Agent safety gate

on:
  pull_request:
    paths:
      - "prompts/**"
      - "**/system_prompt*.txt"

jobs:
  fusion-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fusion-safety
      - name: Scan each agent prompt (must be >= grade B)
        run: |
          for f in prompts/*.txt; do
            echo "::group::$f"
            fusion ci --prompt "$f" --min-grade B --demo   # advisory until a live backend is available
            echo "::endgroup::"
          done
      # NOTE: --demo grades canned demonstration responses, NOT your prompt, and never fails the
      # build. Real gating needs a live backend (local Ollama and/or the claude CLI subscription),
      # so run the pre-commit hook (examples/pre-commit-config.yaml) on developer machines.
