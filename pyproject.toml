[project]
name = "fusion-safety"
version = "0.1.0"
description = "Fusion First — offline test-and-prove engine for agentic AI safety"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.115",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

# The pure core lives in `fusion/`; the Modal/FastAPI wrappers live in `app/`.
# NOTHING under `fusion/` may import `modal` — enforced by tests/test_no_modal_import.py
[tool.setuptools.packages.find]
include = ["fusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, pure, no I/O",
    "integration: cross-module, still offline (cassette-replayed)",
    "live: requires real provider API keys (skipped in CI/offline gate)",
    "benchmark: public-benchmark record/replay (may be slow)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: str+Enum is a deliberate pattern for stable pydantic serialization (not StrEnum).
ignore = ["E501", "UP042"]
