# CLAIMS REGISTRY — every proof-like number in docs or marketing must be registered here and backed by
# committed evidence. Enforced by tests/test_claims_backed.py (unit, runs in the Stop hook).
#
# A claim resolves `evidence` (a committed JSON file), checks each `metrics` entry (dotted path ->
# expected value, abs tolerance 1e-3), enforces `min_n` via `n_path`, and requires the evidence to be
# non-demonstration unless `demonstration_ok` is true (only for deterministic, non-LLM evidence such as
# the guard benchmark). `text` must appear verbatim in every file listed under `files`.
#
# Numbers from unrecorded runs, memory, or the offline stand-in judge are NOT claims. Measure first
# (`fusion validate record` / `report`), commit the evidence, then register the claim here.

claims:
  - id: claude_hook_heldout_v3_overblock
    text: "5% of benign calls prompted"
    qualifier: "fusion-guard hook, held-out v3 (blind, scored once at rules f7d3809), ask mode"
    files: [plugins/fusion-guard/README.md]
    evidence: evals/guard_bench/claude_code_heldout_v3.json
    metrics:
      benign.over_block.point: {value: 0.05, n_path: benign.n, min_n: 50}
    demonstration_ok: false

  - id: claude_hook_heldout_v3_recall
    text: "76% of attack-shaped calls caught"
    qualifier: "fusion-guard hook, held-out v3 (blind, scored once at rules f7d3809); worst finding medium or high"
    files: [plugins/fusion-guard/README.md]
    evidence: evals/guard_bench/claude_code_heldout_v3.json
    metrics:
      malicious.recall.point: {value: 0.7571, n_path: malicious.n, min_n: 50}
    demonstration_ok: false

  - id: runtime_guardrail_step2_recall
    text: "stopped 89% of real attacks"
    qualifier: "runtime guardrail, current rules (0c560b5), on fresh successful attacks against qwen2.5:7b and llama3.1:8b, scored once, pre-registered (PREREG_step2_guard.md)"
    files: []  # README no longer quotes it (owner 2026-10-02); the site reads it from the evidence
    evidence: evals/validation/v1/step2_guard.json
    metrics:
      fusion.all.recall.point: {value: 0.8919, n_path: fusion.all.attacks, min_n: 50}
    demonstration_ok: false

  - id: runtime_guardrail_step2_overblock
    text: "wrongly blocking 1% of clean transcripts"
    qualifier: "same measurement; clean = oracle-clean transcripts"
    files: []  # README no longer quotes it (owner 2026-10-02); the site reads it from the evidence
    evidence: evals/validation/v1/step2_guard.json
    metrics:
      fusion.all.over_block.point: {value: 0.0079, n_path: fusion.all.clean, min_n: 50}
    demonstration_ok: false

  - id: llama_guard_step2_recall
    text: "stopped 52% of the same attacks"
    qualifier: "Llama Guard 3 8B, configured (Meta's format + S15/S16, told the secret), on the same transcripts"
    files: []  # README no longer quotes it (owner 2026-10-02); the site reads it from the evidence
    evidence: evals/validation/v1/step2_guard.json
    metrics:
      llama_guard_b.all.recall.point: {value: 0.5203, n_path: llama_guard_b.all.attacks, min_n: 50}
    demonstration_ok: false

  - id: runtime_guardrail_step3_data_stealing
    text: "100% of data-stealing hijacks"
    qualifier: "guard given the tool results (untrusted_text), rules ce897d1, fresh InjecAgent transcripts of qwen2.5:7b and llama3.1:8b, scored once, pre-registered (PREREG_step3_guard.md)"
    files: []  # README no longer quotes it (owner 2026-10-02); the site reads it from the evidence
    evidence: evals/validation/v1/step3_guard.json
    metrics:
      v3.by_kind.ds.recall.point: {value: 1.0, n_path: v3.by_kind.ds.attacks, min_n: 50}
    demonstration_ok: false

  - id: judge_sonnet_injection_accuracy
    text: "80% accuracy on direct prompt injection"
    qualifier: "Claude Sonnet (Claude Code subagent, host-as-judge, fusion-judge rules) vs deterministic oracle labels on llama3.2:1b InjecAgent transcripts (Trust Report Q1)"
    files: []  # README no longer quotes it (owner 2026-10-02); the site reads it from the evidence
    evidence: evals/validation/v1/judge_eval_host_sonnet.json
    metrics:
      checks.direct_prompt_injection.grader.accuracy.point: {value: 0.8, n_path: checks.direct_prompt_injection.grader.n, min_n: 50}
    demonstration_ok: false

  - id: judge_sonnet_leakage_accuracy
    text: "92% on system prompt leakage"
    qualifier: "same grader vs the planted-password oracle on llama3.2:1b Gandalf transcripts (Trust Report Q1)"
    files: []  # README no longer quotes it (owner 2026-10-02); the site reads it from the evidence
    evidence: evals/validation/v1/judge_eval_host_sonnet.json
    metrics:
      checks.system_prompt_leakage.grader.accuracy.point: {value: 0.9167, n_path: checks.system_prompt_leakage.grader.n, min_n: 50}
    demonstration_ok: false

# Proof-like strings that are NOT claims (e.g. templates, disclaimers). Each needs a reason.
allowlist:
  - file: fusion_first/engine/report_html.py
    text: '<span class="mv">{a.f1:.2f}</span><span class="ml">F1</span>'
    reason: "HTML template that renders the card's measured value — not a static claim"
  - file: frontend/src/pages/Privacy.jsx
    text: "100% accuracy in quality issue detection"
    reason: "Listed under 'DOES NOT guarantee' — a disclaimer, not a claim"
